name: Linux checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Per commit, not per pull request ref. A shared refs/pull/N/merge
# group cancels a run that is still waiting for a hosted runner.
concurrency:
  group: linux-${{ github.sha }}
  cancel-in-progress: false

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps: &linux-steps
      - uses: actions/checkout@v4

      - name: Install compilers, lavapipe, and MinGW
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential g++-12 clang cmake ninja-build pkg-config python3 \
            libvulkan-dev mesa-vulkan-drivers \
            g++-mingw-w64-x86-64 \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libxrender-dev libxxf86vm-dev \
            libdrm-dev libudev-dev libdbus-1-dev libgl1-mesa-dev libegl1-mesa-dev \
            wine

      - name: Fetch AnyPS5 and Madeira
        run: |
          git submodule update --init --depth 1 upstreams/AnyPS5 upstreams/Madeira
          git -C upstreams/AnyPS5 submodule update --init --depth 1

      - name: Apply patches and run the lavapipe capability check
        run: scripts/check-linux.sh

      - name: Build AnyPS5 for Linux
        env:
          ANYPS5_CC: gcc-12
          ANYPS5_CXX: g++-12
        run: scripts/m0-build-anyps5.sh

      - name: Verify complete patch stacks and Vulkan boundary tests
        run: |
          python3 tools/checks/check_patch_stack.py
          python3 tools/checks/test_guest_arena_host_data.py
          CXX=g++-12 python3 tools/checks/test_masked_shift_fold.py
          CXX=g++-12 python3 tools/checks/test_fixed_function_interpolation.py
          python3 tools/checks/test_vulkan_surface_scaling.py
          scripts/check-vulkan-integration.sh

      - name: Build libSceAgcDriver
        run: cmake --build build/anyps5 --target libSceAgcDriver --parallel

      - name: Run synthetic relinker tests
        run: scripts/run-relinker-tests.sh

      - name: Run the synthetic PE under Wine
        run: scripts/m0-synthetic-pe-wine.sh

  # Starts with the primary. A needs: fallback was skipped on c161948
  # when ubuntu-24.04 was cancelled before a runner was assigned.
  linux-ubuntu-22:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps: *linux-steps

  winevulkan:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps: &winevulkan-steps
      - uses: actions/checkout@v4

      - name: Install Wine build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential flex bison gettext pkg-config python3 \
            libvulkan-dev

      - name: Fetch Wine and Madeira
        run: git submodule update --init --depth 1 upstreams/wine upstreams/Madeira

      - name: Build winevulkan.so
        run: scripts/build-wine-vulkan-linux.sh

      - name: Record the unix libraries
        run: |
          file build/wine-linux/dlls/ntdll/ntdll.so \
            build/wine-linux/dlls/win32u/win32u.so \
            build/wine-linux/dlls/winevulkan/winevulkan.so
          objdump -p build/wine-linux/dlls/win32u/win32u.so | grep NEEDED
          strings build/wine-linux/dlls/win32u/vulkan.o | grep libvulkan.so.1

  winevulkan-ubuntu-22:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps: *winevulkan-steps
