name: Windows WinLibs PRX

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# One group per commit. github.ref on a pull_request is
# refs/pull/N/merge for every push, and a newer run cancels a workflow
# that is still pending in that group. The 15-minute
# "not acquired by Runner" cancel is a separate hosted-runner timeout;
# the fallback job covers it.
concurrency:
  group: windows-${{ github.sha }}
  cancel-in-progress: false

jobs:
  winlibs:
    runs-on: windows-latest
    timeout-minutes: 180
    steps: &winlibs-steps
      - uses: actions/checkout@v4

      - name: Fetch AnyPS5
        shell: bash
        run: |
          git submodule update --init --depth 1 upstreams/AnyPS5
          git -C upstreams/AnyPS5 submodule update --init --depth 1

      - name: Build libc.prx and libSceAgcDriver.prx with WinLibs GCC 15.2
        shell: bash
        run: scripts/m0-build-anyps5-winlibs.sh

  # A runner that dies mid-build is conclusion failure, not cancelled
  # ("lost communication with the server" on c161948). Retry that too.
  # The job is skipped when the primary succeeded, so a green build
  # does not queue a second Windows runner.
  winlibs-fallback:
    needs: winlibs
    if: always() && needs.winlibs.result != 'success'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Fetch AnyPS5
        shell: bash
        run: |
          git submodule update --init --depth 1 upstreams/AnyPS5
          git -C upstreams/AnyPS5 submodule update --init --depth 1

      - name: Build libc.prx and libSceAgcDriver.prx with WinLibs GCC 15.2
        shell: bash
        run: scripts/m0-build-anyps5-winlibs.sh
