name: Windows runtime reference

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: windows-${{ github.sha }}
  cancel-in-progress: false

jobs:
  winlibs:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate ELF LLVM tools
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path "$llvm\clang.exe") { $llvm | Out-File -FilePath $env:GITHUB_PATH -Append }
      - name: Fetch AnyPS5
        shell: bash
        run: |
          git submodule update --init --depth 1 upstreams/AnyPS5
          git -C upstreams/AnyPS5 submodule update --init --depth 1
      - name: Build full HLE closure, original guests and runtime package
        shell: bash
        env:
          JOBS: '4'
        run: scripts/windows-runtime-build.sh
      - name: Save package and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-build
          path: |
            build/windows-runtime-artifact/**
            build/anyps5-winlibs/CMakeFiles/CMakeConfigureLog.yaml
            build/demo-smoke/*-manifest.json
            build/guest-cpu/*-manifest.json
            build/guest-exceptions/*-manifest.json
          retention-days: 14

  # Retry only build/runner failures. A deterministic reference-test failure
  # below does not rebuild every PRX for a second time.
  winlibs-fallback:
    needs: winlibs
    if: always() && needs.winlibs.result != 'success'
    runs-on: windows-2022
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Locate ELF LLVM tools
        shell: pwsh
        run: |
          $llvm = Join-Path $env:ProgramFiles 'LLVM\bin'
          if (Test-Path "$llvm\clang.exe") { $llvm | Out-File -FilePath $env:GITHUB_PATH -Append }
      - name: Fetch AnyPS5
        shell: bash
        run: |
          git submodule update --init --depth 1 upstreams/AnyPS5
          git -C upstreams/AnyPS5 submodule update --init --depth 1
      - name: Build full HLE closure, original guests and runtime package
        shell: bash
        env:
          JOBS: '4'
        run: scripts/windows-runtime-build.sh
      - name: Save fallback package and build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-build-fallback
          path: |
            build/windows-runtime-artifact/**
            build/anyps5-winlibs/CMakeFiles/CMakeConfigureLog.yaml
            build/demo-smoke/*-manifest.json
            build/guest-cpu/*-manifest.json
            build/guest-exceptions/*-manifest.json
          retention-days: 14

  reference:
    needs: [winlibs, winlibs-fallback]
    if: always() && (needs.winlibs.result == 'success' || needs.winlibs-fallback.result == 'success')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.winlibs.result == 'success' && 'windows-runtime-build' || 'windows-runtime-build-fallback' }}
          path: build/reference-input
      - name: Unpack verified runtime inputs
        shell: pwsh
        run: |
          python -m zipfile -e build/reference-input/windows-runtime-artifact/runtime-package.zip build/reference-package
      - name: Execute native probes, relinked CPU and exception guests, and GPU smoke if available
        shell: pwsh
        run: |
          python scripts/run-runtime-reference.py build/reference-package --evidence build/windows-reference-evidence --probes-dir build/reference-input/windows-runtime-artifact/probes
      - name: Preserve actual reference evidence, including explicit graphics not_run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-reference-evidence
          path: |
            build/windows-reference-evidence/**
            build/reference-package/package-manifest.json
            build/reference-package/*-manifest.json
          retention-days: 14
